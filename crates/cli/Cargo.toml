[package]
name = "blackhole"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
blackhole-core = { version = "0.1.0", path = "../core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
