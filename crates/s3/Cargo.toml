[package]
name = "blackhole-s3"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
blackhole-core = { version = "0.1.0", path = "../core" }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "service"] }
s3s = "0.17"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
