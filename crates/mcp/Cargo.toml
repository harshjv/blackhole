[package]
name = "blackhole-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
blackhole-core = { version = "0.1.0", path = "../core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
http = "1.5.0"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
